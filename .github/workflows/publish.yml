name: Publish BrandVerse Instagram posts

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ig-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 tools/publish.py
      - name: Save posting log
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "brandverse-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state/posted.json
            git commit -m "Update posting log"
            git push
          fi
